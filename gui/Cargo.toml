[package]
name = "fsvfs-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-fs = "2.2.0"
color-eyre.workspace = true
futures-util.workspace = true
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# https://github.com/slint-ui/slint/pull/11341
slint = { version = "1.17.0", git = "https://github.com/slint-ui/slint.git", rev = "d38b2d6bfffa309f6d5c8ea66cb2126ace52b264", features = [
    "serde",
] }

[build-dependencies]
slint-build = { version = "1.17.0", git = "https://github.com/slint-ui/slint.git", rev = "d38b2d6bfffa309f6d5c8ea66cb2126ace52b264" }
