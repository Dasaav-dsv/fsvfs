name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Cache
      uses: Swatinem/rust-cache@v2
  
    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
