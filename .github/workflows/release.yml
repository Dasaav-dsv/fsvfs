name: Publish release

on:
  release:
    types: created

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    strategy:
      matrix:
        vars:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: fsvfs-linux-amd64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: fsvfs-windows-amd64.zip
    runs-on: ${{ vars.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ vars.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Archive
        run: |
          cd target/release
          tar cafv ${{ vars.archive }} ../../dist fsvfs

      - name: Configure git
        run: |
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@users.noreply.github.com"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: target/release/${{ vars.archive }}

