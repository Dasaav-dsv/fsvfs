[package]
name = "fsvfs"
version = "0.1.3"
edition = "2024"
authors = ["Dasaav"]
license = "MIT OR Apache-2.0"

[workspace]
members = ["gui"]
resolver = "3"

[workspace.dependencies]
embed-manifest = "1.5.0"
eyre = { version = "0.6.12", default-features = false, features = [
    "track-caller",
] }
futures-util = { version = "0.3.32", default-features = false, features = [
    "std",
] }
xxhash-rust = { version = "0.8.15", features = ["const_xxh3", "std", "xxh3"] }
normpath = "1.5.1"
steamlocate = "2.1.0"
windows = "=0.62.2"

[dependencies]
aes = "0.9.0"
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
compio = { version = "0.19.0", default-features = false, features = [
    "dispatcher",
    "fs",
    "polling",
    "io",
    "iocp-wait-packet",
    "runtime",
] }
ctrlc = { version = "3.5.2", features = ["termination"] }
eyre.workspace = true
eytzinger = { version = "1.1.2", default-features = false, features = [
    "branchless",
] }
futures-util.workspace = true
heed = { version = "0.22.1", default-features = false }
indexmap = "2.14.0"
lz4_flex = { version = "0.13.1", default-features = false, features = [
    "checked-decode",
    "safe-decode",
    "std",
] }
malachite = { version = "0.9.1", default-features = false, features = [
    "malachite-nz",
    "naturals_and_integers",
    "std",
] }
rayon = "1.12.0"
rkyv = "0.8.16"
simple-eyre = "0.3.1"
smallvec = { version = "1.15.1", features = [
    "const_generics",
    "union",
    "const_new",
] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["ansi"] }
xxhash-rust.workspace = true
zerocopy = { version = "0.8.48", features = ["derive", "std"] }

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.17.0", default-features = false }
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
papaya = "0.2.4"
tempfile = { version = "3.27.0", default-features = false }
windows = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_Storage_ProjectedFileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest.workspace = true

[dev-dependencies]
steamlocate.workspace = true
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[profile.test.package.malachite]
opt-level = 3

[profile.test.package.xxhash-rust]
opt-level = 3

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
