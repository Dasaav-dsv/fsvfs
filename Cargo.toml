[package]
name = "fsvfs"
version = "0.1.2"
edition = "2024"
authors = ["Dasaav"]
license = "MIT OR Apache-2.0"

[dependencies]
aes = "0.9.0"
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
compio = { version = "0.19.0", default-features = false, features = [
    "dispatcher",
    "fs",
    "polling",
    "io",
    "iocp-wait-packet",
    "runtime",
] }
ctrlc = { version = "3.5.2", features = ["termination"] }
eytzinger = { version = "1.1.2", default-features = false, features = [
    "branchless",
] }
futures-util = "0.3.32"
fxhash = "0.2.1"
indexmap = { version = "2.14.0", features = ["rayon"] }
malachite = { version = "0.9.1", default-features = false, features = [
    "malachite-nz",
    "naturals_and_integers",
    "std",
] }
rayon = "1.12.0"
rkyv = "0.8.16"
smallvec = { version = "1.15.1", features = [
    "const_generics",
    "union",
    "const_new",
] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["ansi"] }
zerocopy = { version = "0.8.48", features = ["derive", "std"] }

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.17.0", default-features = false }
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
papaya = "0.2.4"
tempfile = { version = "3.27.0", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Storage_ProjectedFileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5.0"

[dev-dependencies]
steamlocate = "2.1.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[profile.test.package.malachite]
opt-level = 3

[profile.test.package.malachite-nz]
opt-level = 3

[profile.test.package.xxhash-rust]
opt-level = 3
